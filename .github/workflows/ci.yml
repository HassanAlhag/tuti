name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: node --test $(find backend/src -name "*.test.js" | tr '\n' ' ')
        env:
          NODE_ENV: test

  build-apps:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - app: web
            pkg: "@tuti/web"
            env_extra: |
              VITE_SELLER_URL=http://localhost:5174
              VITE_DRIVER_URL=http://localhost:5176
              VITE_SR_URL=http://localhost:5177
              VITE_ADMIN_URL=http://localhost:5175
          - app: seller
            pkg: "@tuti/seller"
            env_extra: ""
          - app: admin
            pkg: "@tuti/admin"
            env_extra: ""
          - app: driver
            pkg: "@tuti/driver"
            env_extra: ""
          - app: sr
            pkg: "@tuti/sr"
            env_extra: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.app }}
        run: npm run build -w ${{ matrix.pkg }}
        env:
          VITE_API_URL: http://localhost:5055/api

  docker-backend:
    name: Docker backend image
    runs-on: ubuntu-latest
    needs: [backend, build-apps]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t tuti-backend ./backend
